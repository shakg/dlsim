name: Build and Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  BUILD_DEPS: >-
    build-essential cmake ninja-build libgl-dev file patchelf dpkg-dev
    qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-charts-dev
    qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts
    qml6-module-qtquick-window qml6-module-qtquick-templates
    qml6-module-qtqml-workerscript qml6-module-qtquick-dialogs
    qml6-module-qt-labs-folderlistmodel qml6-module-qtcharts
    qml6-module-qt5compat-graphicaleffects qt6-qpa-plugins

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Match tag to CMake project version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^project(dlsim VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [[ -z "$version" ]]; then
            echo "Could not read the project version from CMakeLists.txt" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build and package
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $BUILD_DEPS

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Build Debian package
        run: |
          cd build
          cpack -G DEB
          dpkg-deb --info dlsim_*.deb
          dpkg-deb --contents dlsim_*.deb

      - name: Smoke-test Debian package
        run: |
          sudo apt-get install -y ./build/dlsim_*.deb
          mkdir -p shots/deb
          QT_QPA_PLATFORM=offscreen DLSIM_NO_HELPER=1 DLSIM_SCREENSHOT=shots/deb timeout 60 dlsim
          ls shots/deb/page3.png

      - name: Build AppImage
        run: packaging/appimage/build-appimage.sh dist-out

      - name: Smoke-test AppImage
        run: |
          sudo apt-get remove -y dlsim
          mkdir -p shots/appimage
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen DLSIM_NO_HELPER=1 DLSIM_SCREENSHOT=shots/appimage \
            timeout 120 ./dist-out/DLSim-*-x86_64.AppImage
          ls shots/appimage/page3.png

      - name: Stage release packages
        run: |
          mkdir release-artifacts
          cp build/dlsim_*.deb release-artifacts/
          cp dist-out/DLSim-*-x86_64.AppImage release-artifacts/

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: dlsim-${{ needs.version.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error

      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-screenshots-${{ needs.version.outputs.version }}
          path: shots/
          if-no-files-found: ignore

  selftest:
    name: Self-test (netem in network namespaces)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build qt6-base-dev \
            iproute2 iperf3 jq iputils-ping
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe -a sch_netem sch_prio ifb cls_flower cls_matchall act_mirred

      - name: Build the helper
        run: |
          cmake -S . -B build -G Ninja -DDLSIM_BUILD_GUI=OFF -DDLSIM_BUILD_TESTS=OFF
          cmake --build build

      - name: Run selftest.sh
        run: sudo scripts/selftest.sh build/helper/dlsim-helper presets/presets.json

  release:
    name: Create GitHub release
    needs: [version, build, selftest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: dlsim-${{ needs.version.outputs.version }}
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum dlsim_*.deb DLSim-*.AppImage > SHA256SUMS.txt

      - name: Create or update release
        shell: bash
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          else
            gh release edit "$TAG" --title "$TAG"
          fi
          gh release upload "$TAG" --clobber \
            artifacts/dlsim_*.deb \
            artifacts/DLSim-*.AppImage \
            artifacts/SHA256SUMS.txt
